version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodshare_db
    restart: always
    environment:
      POSTGRES_USER: foodshare_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: foodshare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: foodshare_redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: foodshare_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://foodshare_user:secretpassword@postgres:5432/foodshare_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: foodshare_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
