name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. CI - Проверка сборки и тестов на виртуальной машине GitHub
  test-and-build:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install dependencies & Build Server
        run: |
          cd server
          npm ci
          npm run build

      - name: Install dependencies & Build Client
        run: |
          cd client
          npm ci
          npm run build

  # 2. CD - Автоматический деплой на Ubuntu Server (только при push в ветку main)
  deploy:
    name: Deploy to Ubuntu Server
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            # Переходим в директорию проекта
            cd /home/${{ secrets.SSH_USER }}/foodshare_vyatsu

            # Подтягиваем последние изменения из репозитория
            git reset --hard
            git pull origin main

            # Собираем и поднимаем контейнеры в фоне
            docker compose down --remove-orphans
            docker compose up -d --build

            # Небольшая пауза для готовности PostgreSQL перед накатом схемы
            sleep 3

            # Применяем схему Prisma (db:migrate или fallback db push)
            docker compose exec -T server npm run db:migrate || docker compose exec -T server npx prisma db push --skip-generate


            # Очищаем старые неиспользуемые Docker-образы (экономия диска)
            docker image prune -f

